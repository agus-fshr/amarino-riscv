# Verilator -Wall warning codes ignored by gate 1, with the reason. The linted
# Verilog is generated by Amaranth + yosys, so codes describing the shape of
# generated code rather than the design are waived. Everything else in -Wall,
# including UNOPTFLAT, MULTIDRIVEN, LATCH, UNDRIVEN and COMBDLY, stays on.

DECLFILENAME = "Generated file holds every module of the hierarchy; file naming is not a design property"
SIMILARNAME = "Amaranth flattens interface paths (pc_in__pc), which can differ only in case"
PROCASSINIT = "yosys write_verilog emits initial values for registers it also assigns in always blocks"
UNUSEDSIGNAL = "Amaranth emits every named signal; unused component inputs are checked at Amaranth level (g1.port.*)"
UNUSEDPARAM = "yosys emits parameters for memory init it does not always reference"
WIDTHEXPAND = "Amaranth fixes all width extension before codegen; yosys emits minimal-width constants that Verilog then extends exactly as Amaranth specified"
WIDTHTRUNC = "Same as WIDTHEXPAND: truncations in generated code are the ones Amaranth's semantics define"
CASEINCOMPLETE = "yosys emits casez statements whose uncovered values keep the default assignment made just before the case"
