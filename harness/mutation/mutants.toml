# Deliberately broken copies of the core. Each mutant replaces one exact piece of
# text (it must occur exactly once in `file`) in a temporary copy of amarino/.
# The harness is validated by showing that every mutant is caught by at least one
# gate (`python -m harness.mutation`).
#
# A mutant that cannot be observed on the CURRENT core (because a pre-existing bug
# makes it behave identically) may carry `equivalent = "<reason>"`. It is then
# expected to survive, and if it is killed the run is red, so the note can't go stale.
#
# These texts match the core as of the harness PRs. When the core changes and a
# mutant no longer applies, the mutation run reports it (ERROR) and the mutant
# must be updated. Only humans edit this file.

[[mutant]]
id = "alu-sub-as-add"
what = "SUB computes A + B"
file = "amarino/modules/alu.py"
old = """                    with m.If((self.functions.func7[5]) & self.flags_in.isALUreg):
                        m.d.comb += self.rd_bus.rd_data.eq(self.data_buses.A - self.data_buses.B)"""
new = """                    with m.If((self.functions.func7[5]) & self.flags_in.isALUreg):
                        m.d.comb += self.rd_bus.rd_data.eq(self.data_buses.A + self.data_buses.B)"""

