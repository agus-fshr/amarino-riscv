new = "self.rd_bus.rd_data.eq(self.data_buses.A < self.data_buses.B)"

[[mutant]]
id = "alu-sra-as-srl"
what = "SRA/SRAI shift logically"
file = "amarino/modules/alu.py"
old = "self.rd_bus.rd_data.eq(self.data_buses.A.as_signed() >> self.shamt)"
new = "self.rd_bus.rd_data.eq(self.data_buses.A >> self.shamt)"
equivalent = "alu.shamt is never driven (g1.port.alu.shamt), so every shift is by 0 and arithmetic and logical right shifts give the same result"

