# riscv-formal configuration for the amarino core. See DEPTH.md for the depths and
# harness/gate3_formal/__init__.py for how this is run. Depth lines are
#   <check> [reset cycles] [trigger cycle] <depth>
# Reset is held for exactly one cycle (the core's sync reset), so the checkers watch
# every retirement from the first one on.

[options]
isa rv32i
nret 1
solver boolector

[depth]
insn            20
ill             20
reg        1    25
pc_fwd     1    20
pc_bwd     1    20
causal     1    20
unique     1 10 20
liveness   1 10 30
hang       1    20
cover      1    20

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
@basedir@/cores/@core@/top.v

[cover]
// Evaluated at the check cycle (step 20) only, the depth of every insn, pc, causal
// and unique check. All must be reachable, or the depth is not sufficient:
//  1. an instruction can retire at step 20 (the insn checks are not vacuous);
//  2. it can have at least 3 older retired instructions, i.e. more than the core's
//     3-stage pipeline holds in flight, so every hazard/forwarding/flush situation
//     involving the checked instruction fits in the window;
//  3. it can have at least 7 older ones (histories longer than any pipeline window).
always @* if (!reset && check) cover (channel[0].valid);
always @* if (!reset && check) cover (channel[0].valid && channel[0].cnt_insns >= 4);
always @* if (!reset && check) cover (channel[0].valid && channel[0].cnt_insns >= 8);
